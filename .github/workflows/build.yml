name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile
        run: cl /O2 /MT Omega_3r4b.cpp /Fe:Omega_3r4b.exe /link /SUBSYSTEM:WINDOWS advapi32.lib psapi.lib
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Omega_3r4b
          path: Omega_3r4b.exe
